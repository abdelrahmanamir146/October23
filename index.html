<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12090d">
  <title>A Little Something ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 50% 35%, #3a1824 0%, #1b0d13 42%, #090507 100%);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      width: min(92vw, 720px);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .heart {
      font-size: 58px;
      margin-bottom: 24px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .32em;
      text-transform: uppercase;
      opacity: .58;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(34px, 8vw, 62px);
      font-weight: 400;
      margin: 0 0 38px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 520px;
      margin: auto;
    }

    .box {
      padding: 20px 8px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      background: rgba(255,255,255,.035);
      backdrop-filter: blur(8px);
    }

    .number {
      font-family: Arial, sans-serif;
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 300;
    }

    .label {
      font-family: Arial, sans-serif;
      font-size: 9px;
      letter-spacing: .18em;
      opacity: .45;
      margin-top: 7px;
    }

    .date {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: .16em;
      opacity: .4;
      margin-top: 28px;
    }

    .hidden { display: none; }

    .reveal {
      animation: reveal 1.5s ease both;
    }

    .big-heart {
      font-size: 72px;
      animation: float 3.5s ease-in-out infinite;
      margin-bottom: 25px;
    }

    .message {
      font-size: clamp(64px, 15vw, 120px);
      line-height: .95;
      font-weight: 400;
      letter-spacing: -.045em;
      margin: 0;
    }

    .sub {
      margin-top: 28px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      opacity: .5;
      letter-spacing: .08em;
    }

    button {
      margin-top: 30px;
      padding: 13px 23px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.06);
      color: white;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    button:hover { background: rgba(255,255,255,.12); }

    .particle {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      animation: rise linear forwards;
      z-index: 1;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(25px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(.7); opacity: 0; }
      15% { opacity: .55; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
    }

    @media (max-width: 420px) {
      .box { padding: 15px 4px; }
      .countdown { gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- COUNTDOWN -->
    <section id="waiting">
      <div class="heart">♡</div>
      <div class="eyebrow">Something is waiting for you</div>
      <h1>Just a little longer...</h1>

      <div class="countdown">
        <div class="box">
          <div id="days" class="number">00</div>
          <div class="label">DAYS</div>
        </div>
        <div class="box">
          <div id="hours" class="number">00</div>
          <div class="label">HOURS</div>
        </div>
        <div class="box">
          <div id="minutes" class="number">00</div>
          <div class="label">MINUTES</div>
        </div>
        <div class="box">
          <div id="seconds" class="number">00</div>
          <div class="label">SECONDS</div>
        </div>
      </div>

      <div class="date">OCTOBER 23 · 12:00 AM</div>
    </section>

    <!-- REVEAL -->
    <section id="revealed" class="hidden reveal">
      <div class="big-heart">♥</div>
      <div class="eyebrow">I found a girl...</div>
      <h1 class="message">Love U</h1>
      <div class="sub">❤️</div>

      <!-- Put your music file beside this HTML and name it music.mp3 -->
      <audio id="music" preload="auto" src="music.mp3"></audio>
      <button id="musicBtn" type="button">♫ Play music</button>
    </section>

  </main>

  <script>
    // October 23, 2026 at 12:00 AM Egypt time (UTC+3)
    const target = new Date("2026-10-23T00:00:00+03:00").getTime();

    const waiting = document.getElementById("waiting");
    const revealed = document.getElementById("revealed");

    const days = document.getElementById("days");
    const hours = document.getElementById("hours");
    const minutes = document.getElementById("minutes");
    const seconds = document.getElementById("seconds");

    let timer;

    function pad(value) {
      return String(Math.max(0, value)).padStart(2, "0");
    }

    function reveal() {
      clearInterval(timer);
      waiting.classList.add("hidden");
      revealed.classList.remove("hidden");
      startHearts();
    }

    function updateCountdown() {
      const difference = target - Date.now();

      if (difference <= 0) {
        reveal();
        return;
      }

      const totalSeconds = Math.floor(difference / 1000);

      days.textContent = pad(Math.floor(totalSeconds / 86400));
      hours.textContent = pad(Math.floor((totalSeconds % 86400) / 3600));
      minutes.textContent = pad(Math.floor((totalSeconds % 3600) / 60));
      seconds.textContent = pad(totalSeconds % 60);
    }

    function startHearts() {
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) return;

      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "particle";
        heart.textContent = Math.random() > .5 ? "♥" : "♡";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.bottom = "-30px";
        heart.style.fontSize = (12 + Math.random() * 18) + "px";
        heart.style.animationDuration = (5 + Math.random() * 5) + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 11000);
      }, 900);
    }

    updateCountdown();
    timer = setInterval(updateCountdown, 1000);

    const music = document.getElementById("music");
    const musicBtn = document.getElementById("musicBtn");

    musicBtn.addEventListener("click", async () => {
      try {
        if (music.paused) {
          await music.play();
          musicBtn.textContent = "♫ Pause music";
        } else {
          music.pause();
          musicBtn.textContent = "♫ Play music";
        }
      } catch {
        musicBtn.textContent = "Add music.mp3";
      }
    });
  </script>
</body>
</html>
